name: LightTouchiOS
options:
  bundleIdPrefix: dev.lighttouch
  deploymentTarget: { iOS: "16.0" }
packages:
  HostRuntime: { path: ../../Packages/HostRuntime }
  # Device preparation from an IPSW, in-process (patched for iOS by ios/scripts/patch-firmwarekit.py).
  FirmwareKit: { path: ../../Packages/FirmwareKit }
  # Same version FirmwareKit pins: reads the Mac release zip for the boot ROMs and guest tools.
  ZIPFoundation: { url: "https://github.com/weichsel/ZIPFoundation.git", exactVersion: "0.9.20" }
targets:
  LightTouchiOS:
    type: application
    platform: iOS
    sources:
      - Sources
      # The Mac app's own firmware list and device art, so both apps offer and show the same things.
      - path: ../../LightTouchMac/Resources/firmware-catalog.json
        buildPhase: resources
      # Our own catalog holds the app icon; the Mac's holds the device art (shells, gradient).
      - Assets.xcassets
      - path: ../../LightTouchMac/Assets.xcassets
      # The Mac app's 3D devices (View › 3D) and their studio lighting, as a folder (Models/<name>.usdz), and the
      # special trick's chime.
      - path: ../../Models
        type: folder
        buildPhase: resources
      - path: ../../LightTouchMac/special_trick.mp3
        buildPhase: resources
      # The changelog, so the app can show what each update changed (Main menu > What's new).
      - path: ../../CHANGELOG.md
        buildPhase: resources
      # The GL front end iOS 6+ devices are brought up to (GuestGL.swift): LightTouchMac v1.0-2026.11.16's
      # guest-tools/OpenGLES, raw DEFLATE so it is data, not a loose Mach-O in the bundle.
      - path: Resources/gl-frontend-2026.11.16.deflate
        buildPhase: resources
    dependencies:
      - package: HostRuntime
      - package: FirmwareKit
        product: FirmwareKit
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_NAME: LightTouch
        PRODUCT_BUNDLE_IDENTIFIER: dev.lighttouch.ios
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        TARGETED_DEVICE_FAMILY: "1,2"
