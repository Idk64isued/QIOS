name: iOS build

# What the run is called in the Actions list. A push is named for its commit, which is where an update's name lives
# ("Update 61 — Cydia Oh My Cydia"); a run started by hand says so, with the branch, since it has no commit of its
# own to be named after. The build also reads the name out of the CHANGELOG into its summary, so a run whose commit
# forgot to carry it still says which update it is.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('iOS build by hand ({0})', github.ref_name)
      || github.event.head_commit.message }}

on:
  workflow_dispatch:
  push:
    paths: ["ios/**", "build-support/**", ".github/workflows/ios.yml"]

# A newer push makes an older run pointless: cancel it instead of letting both burn macOS minutes.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------------------------------------------
  # ~30 seconds on Linux. Catches the mistakes that have broken builds before a macOS runner even starts.
  # Same thing locally:  pip install tree-sitter==0.26.1 tree-sitter-swift==0.7.4
  #                      python3 ios/scripts/precheck.py ios/App/Sources
  # --------------------------------------------------------------------------------------------------------------
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      update: ${{ steps.name.outputs.update }}
    steps:
      - uses: actions/checkout@v4
      - name: Which update this is
        # The CHANGELOG's newest heading ("## Update 61 — Cydia Oh My Cydia") is where an update's number and name
        # are written down, so the build takes them from there rather than from anything typed twice. It goes at the
        # top of the run's summary, and is passed to the build job, which stamps it into the app.
        id: name
        run: |
          UPDATE=$(sed -nE 's/^## +(Update .*)$/\1/p' CHANGELOG.md | head -1)
          [ -n "$UPDATE" ] || UPDATE="Unnamed update"
          echo "update=$UPDATE" >> "$GITHUB_OUTPUT"
          echo "## $UPDATE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install tree-sitter==0.26.1 tree-sitter-swift==0.7.4 unicorn==2.1.4
      - name: Check the app sources
        run: |
          set -o pipefail
          python3 ios/scripts/precheck.py ios/App/Sources | tee precheck.txt
      - name: Put the errors on the right lines
        if: failure()
        run: |
          sed -nE 's/^([^:]+):([0-9]+): error: (.*)$/::error file=\1,line=\2::\3/p' precheck.txt
      - name: The checker still catches past mistakes
        run: python3 ios/scripts/precheck-selftest.py
      - name: Every xcodebuild option exists
        run: python3 ios/scripts/check-workflow-flags.py
      - name: The guest helper matches its source and runs
        run: |
          python3 ios/guest-helper/build.py --check
          python3 ios/guest-helper/test.py

  build:
    needs: precheck
    runs-on: macos-26
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the build into the app
        # So every log says which build wrote it. A log without this is from before this change; a log whose commit
        # is not the one under investigation is answering a question about a different build.
        run: |
          plutil -replace CFBundleVersion -string "${{ github.run_number }}" ios/App/Info.plist
          plutil -replace CFBundleShortVersionString -string "1.0-${GITHUB_SHA:0:7}" ios/App/Info.plist
          # The update's name as well as its hash, so a log says which update it is in the words we use for it.
          plutil -replace LTMUpdateName -string "${{ needs.precheck.outputs.update }}" ios/App/Info.plist
          plutil -p ios/App/Info.plist | grep -iE 'bundleversion|LTMUpdateName' || true
      - name: Tools
        run: brew install meson ninja pkg-config jq xcodegen ldid
      - name: The pins the iOS build uses
        # The caches below are keyed on what goes into them, not on the whole of the Mac app's dependency list: an
        # upstream merge that only adds a Mac package (TelemetryDeck, say) leaves ANGLE, the libraries and the emulator
        # as they were, so it must not rebuild them. ios/.ci/ is written here, never committed.
        run: |
          mkdir -p ios/.ci
          python3 - <<'PY'
          import json
          used = {"glib", "pcre2", "pixman", "slirp", "proxy-libintl", "ffmpeg", "openssl", "nettle", "ANGLE"}
          packages = json.load(open("build-support/dependencies.json"))["packages"]
          picked = sorted((p for p in packages if p["name"] in used), key=lambda p: p["name"])
          missing = used - {p["name"] for p in picked}
          if missing:
              raise SystemExit(f"build-support/dependencies.json no longer has {sorted(missing)}")
          json.dump(picked, open("ios/.ci/deps.json", "w"), sort_keys=True, indent=1)
          PY
          jq -r '."qemu-ios".commit' ios/qemu-ios.json
      - name: Apply the HostRuntime iOS patch
        run: patch -p1 < ios/patches/0001-hostruntime-ios.patch
      - name: Patch FirmwareKit for iOS (on-device firmware preparation)
        id: fk
        run: |
          # Applies in the CI checkout only. If upstream moved and an edit no longer fits, the app is still built,
          # without the preparer, and the log says which edit to fix.
          if python3 ios/scripts/patch-firmwarekit.py 2>&1 | tee "$RUNNER_TEMP/firmwarekit-patch.log"; then
            echo "patched=yes" >> "$GITHUB_OUTPUT"
          else
            echo "patched=no" >> "$GITHUB_OUTPUT"
            echo "::warning::FirmwareKit could not be patched for iOS; building without on-device firmware preparation."
          fi

      # ---- The app first: nearly every failure has been here, and it takes ~5 minutes, not ~13.
      - name: Build the app
        working-directory: ios/App
        run: |
          set -o pipefail
          # Xcode's "Continue building after errors" (a preference, not an xcodebuild flag): one run reports every
          # broken file, not just the first.
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          build() {  # SPEC LOG
            rm -rf LightTouchiOS.xcodeproj
            xcodegen generate --spec "$1" || return 1
            # -skipMacroValidation: FirmwareKit's swift-binary-parsing ships a Swift macro, which Xcode otherwise
            #   gates behind a trust prompt no CI can answer ("must be enabled before it can be used").
            xcodebuild -project LightTouchiOS.xcodeproj -scheme LightTouchiOS -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
              -skipMacroValidation -skipPackagePluginValidation \
              CODE_SIGNING_ALLOWED=NO > "$2" 2>&1
          }
          errors() { grep -E "error:|fatal error" "$1" | grep -v "failed with exit code" | sort -u | head -80 || true; }
          report() {  # LOG TITLE -> errors.txt, the run summary, and annotations on the right lines
            errors "$1" > "$RUNNER_TEMP/errors.txt"
            cat "$RUNNER_TEMP/errors.txt"
            { echo "### $2"; echo '```'; cat "$RUNNER_TEMP/errors.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            sed -nE "s#^$GITHUB_WORKSPACE/([^:]+):([0-9]+):([0-9]+): error: (.*)\$#::error file=\1,line=\2,col=\3::\4#p" \
              "$RUNNER_TEMP/errors.txt" | head -40
          }
          FULL="$RUNNER_TEMP/build-full.log"; LITE="$RUNNER_TEMP/build-lite.log"
          if [ "${{ steps.fk.outputs.patched }}" = "yes" ] && build project.yml "$FULL"; then
            echo "### Built with on-device firmware preparation" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -f "$FULL" ]; then
            # Errors only in the app's own sources fail the lite build the same way: don't spend 4 minutes proving it.
            # Same for xcodebuild refusing its own command line.
            if ! errors "$FULL" | grep "error:" | grep -v "^xcodebuild: error:" | grep -qv "ios/App/Sources/"; then
              report "$FULL" "The app's own code does not compile"
              exit 1
            fi
            echo "::warning::The build with on-device firmware preparation failed; building without it (build-full.log)."
            report "$FULL" "Built WITHOUT on-device firmware preparation; the full build failed with"
          fi
          if ! build project-lite.yml "$LITE"; then
            report "$LITE" "The fallback build failed too"
            tail -40 "$LITE"
            exit 1
          fi
          echo "Built without on-device firmware preparation."

      # ---- ANGLE for iOS (the default GL renderer): built once per pinned commit and cached. Its first build takes
      # most of an hour; if it fails, the emulator is built without it and runs on the iPhone's own GL (EAGL).
      - name: Restore ANGLE
        id: acache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/angle-ios
          key: angle-ios-${{ hashFiles('ios/.ci/deps.json', 'build-support/patches/angle-metal-strong.patch', 'ios/scripts/build-angle-ios.sh') }}
      - name: Build ANGLE (Metal, arm64 iOS)
        id: abuild
        if: steps.acache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 150
        run: bash ios/scripts/build-angle-ios.sh "$RUNNER_TEMP/angle-src" "$RUNNER_TEMP/angle-ios"
      - name: Save ANGLE
        if: steps.acache.outputs.cache-hit != 'true' && steps.abuild.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/angle-ios
          key: ${{ steps.acache.outputs.cache-primary-key }}
      - name: Free the ANGLE checkout
        if: always()
        run: rm -rf "$RUNNER_TEMP/angle-src"
      - name: Is ANGLE here
        id: angle
        run: |
          if [ -f "$RUNNER_TEMP/angle-ios/libEGL.dylib" ] && [ -f "$RUNNER_TEMP/angle-ios/libGLESv2.dylib" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::warning::ANGLE did not build; this emulator runs every device on the iPhone's own GL (no ES 2.0 devices on the GPU)"
          fi

      # ---- The emulator libraries: rebuilt only when something that goes into them changes.
      - name: Emulator cache key
        id: qkey
        run: echo "xcode=$(xcodebuild -version | tr -d '\n ')" >> "$GITHUB_OUTPUT"
      - name: Restore emulator libraries
        id: qcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/qemu-lib
          key: qemu-lib-${{ steps.qkey.outputs.xcode }}-angle-${{ steps.angle.outputs.have }}-${{ hashFiles('ios/qemu-ios.json', 'ios/.ci/deps.json', 'ios/patches/qemu-ios/**', 'ios/scripts/build-qemu.sh', 'ios/scripts/make-dylib-ios.sh', 'ios/scripts/build-deps.sh') }}
      - name: Fetch qemu-ios at the commit ios/qemu-ios.json pins
        # The iOS emulator has its own pin, not the Mac app's (build-support/sources.json): ios/patches/qemu-ios are
        # made against this commit, and an upstream merge that moves the Mac's emulator must not move this one under
        # them. Moving it is its own job: rebase the patches onto the new commit, then change ios/qemu-ios.json.
        if: steps.qcache.outputs.cache-hit != 'true'
        run: |
          URL=$(jq -r '."qemu-ios".repository' ios/qemu-ios.json)
          REF=$(jq -r '."qemu-ios".commit' ios/qemu-ios.json)
          git clone "$URL" "$RUNNER_TEMP/qemu-ios"
          git -C "$RUNNER_TEMP/qemu-ios" checkout "$REF"
      - name: Restore dependencies cache
        if: steps.qcache.outputs.cache-hit != 'true'
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ios-deps
          key: ios-deps-${{ hashFiles('ios/.ci/deps.json', 'ios/scripts/build-deps.sh') }}
      - name: Build dependencies
        if: steps.qcache.outputs.cache-hit != 'true' && steps.cache.outputs.cache-hit != 'true'
        run: bash ios/scripts/build-deps.sh "$RUNNER_TEMP/qemu-ios" "$RUNNER_TEMP/ios-deps"
      - name: Save dependencies cache
        if: steps.qcache.outputs.cache-hit != 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ios-deps
          key: ios-deps-${{ hashFiles('ios/.ci/deps.json', 'ios/scripts/build-deps.sh') }}
      - name: Build emulator libraries (JIT + interpreter)
        if: steps.qcache.outputs.cache-hit != 'true'
        run: |
          if [ "${{ steps.angle.outputs.have }}" = yes ]; then export LTM_ANGLE="$RUNNER_TEMP/angle-ios"; fi
          bash ios/scripts/build-qemu.sh "$RUNNER_TEMP/qemu-ios" "$RUNNER_TEMP/ios-deps/prefix" "$RUNNER_TEMP/qemu-out"
          mkdir -p "$RUNNER_TEMP/qemu-lib" && cp "$RUNNER_TEMP"/qemu-out/*.dylib "$RUNNER_TEMP/qemu-lib/"
          # The profiler's addresses (ThreadSampler) -> function names: libqemu-arm.dylib+0x... is an nm address.
          nm -n "$RUNNER_TEMP/qemu-lib/libqemu-arm.dylib" > "$RUNNER_TEMP/qemu-lib/qemu-symbols.txt" || true
      - name: Save emulator libraries
        if: steps.qcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/qemu-lib
          key: ${{ steps.qcache.outputs.cache-primary-key }}

      - name: Package IPA
        run: |
          APP="ios/App/build/Build/Products/Release-iphoneos/LightTouch.app"
          test -f "$RUNNER_TEMP/qemu-lib/libqemu-arm.dylib" && test -f "$RUNNER_TEMP/qemu-lib/libqemu-arm-tci.dylib"
          mkdir -p "$APP/Frameworks" && cp "$RUNNER_TEMP"/qemu-lib/*.dylib "$APP/Frameworks/"
          if [ "${{ steps.angle.outputs.have }}" = yes ]; then
            bash ios/scripts/package-angle.sh "$RUNNER_TEMP/angle-ios" "$APP/Frameworks"
            mkdir -p "$APP/Licenses/ANGLE" && cp "$RUNNER_TEMP"/angle-ios/licenses/* "$APP/Licenses/ANGLE/"
          fi
          ldid -Sios/App/LightTouchiOS.entitlements "$APP/LightTouch"
          mkdir Payload && cp -R "$APP" Payload/ && zip -qry LightTouch.ipa Payload
          SRC=rebuilt; [ "${{ steps.qcache.outputs.cache-hit }}" = "true" ] && SRC="from cache"
          echo "### ${{ needs.precheck.outputs.update }}" >> "$GITHUB_STEP_SUMMARY"
          echo "LightTouch.ipa $(du -h LightTouch.ipa | cut -f1), emulator libraries $SRC, ANGLE ${{ steps.angle.outputs.have }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: LightTouch-ipa, path: LightTouch.ipa }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/errors.txt
            ${{ runner.temp }}/qemu-lib/qemu-symbols.txt
            ${{ runner.temp }}/build-full.log
            ${{ runner.temp }}/build-lite.log
            ${{ runner.temp }}/firmwarekit-patch.log
            ${{ runner.temp }}/ios-deps/logs
            ${{ runner.temp }}/angle-ios/ninja.log
