name: iOS build
on:
  workflow_dispatch:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Fetch qemu-ios at the commit build-support/sources.json pins
        run: |
          URL=$(jq -r '."qemu-ios".repository' build-support/sources.json)
          REF=$(jq -r '."qemu-ios".commit' build-support/sources.json)
          git clone "$URL" "$RUNNER_TEMP/qemu-ios"
          git -C "$RUNNER_TEMP/qemu-ios" checkout "$REF"
      - name: Tools
        run: brew install meson ninja pkg-config jq xcodegen ldid
      - name: Apply the HostRuntime iOS patch
        run: patch -p1 < ios/patches/0001-hostruntime-ios.patch
      - name: Restore dependencies cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ios-deps
          key: ios-deps-${{ hashFiles('build-support/dependencies.json', 'ios/scripts/build-deps.sh') }}
      - name: Build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash ios/scripts/build-deps.sh "$RUNNER_TEMP/qemu-ios" "$RUNNER_TEMP/ios-deps"
      - name: Save dependencies cache (so later failures do not rebuild them)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ios-deps
          key: ios-deps-${{ hashFiles('build-support/dependencies.json', 'ios/scripts/build-deps.sh') }}
      - name: Build emulator libraries (JIT + interpreter)
        run: bash ios/scripts/build-qemu.sh "$RUNNER_TEMP/qemu-ios" "$RUNNER_TEMP/ios-deps/prefix" "$RUNNER_TEMP/qemu-out"
      - name: Build the app
        working-directory: ios/App
        run: |
          xcodegen generate
          xcodebuild -project LightTouchiOS.xcodeproj -scheme LightTouchiOS -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          APP="ios/App/build/Build/Products/Release-iphoneos/LightTouch.app"
          mkdir -p "$APP/Frameworks" && cp "$RUNNER_TEMP"/qemu-out/*.dylib "$APP/Frameworks/"
          ldid -Sios/App/LightTouchiOS.entitlements "$APP/LightTouch"
          mkdir Payload && cp -R "$APP" Payload/ && zip -qry LightTouch.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: LightTouch-ipa, path: LightTouch.ipa }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: build-logs, path: "${{ runner.temp }}/ios-deps/logs" }

  # ------------------------------------------------------------------
  # Non-blocking probe jobs: these run in parallel with the main build
  # and always succeed (exit 0). They discover what needs fixing for
  # on-device firmware preparation and the USB install stack.
  # ------------------------------------------------------------------

  probe-firmwarekit:
    runs-on: macos-26
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Apply FirmwareKit iOS patch
        run: |
          patch -p1 < ios/patches/0002-firmwarekit-ios.patch || echo "Patch had issues (expected during probe)"
      - name: Attempt FirmwareKit iOS build
        run: |
          # Try to build FirmwareKit for iOS to see how far it gets
          cd Packages/FirmwareKit
          swift build --sdk iphoneos 2>&1 | tee "$RUNNER_TEMP/firmwarekit-probe.log" || true
          echo ""
          echo "=== FirmwareKit iOS probe complete ==="
          echo "Check the log for what still needs fixing."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmwarekit-probe-log
          path: ${{ runner.temp }}/firmwarekit-probe.log

  probe-usb:
    runs-on: macos-26
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install automake autoconf libtool pkg-config meson ninja
      - name: Probe USB stack cross-build
        run: bash ios/scripts/build-usb.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usb-probe-logs
          path: usb-logs/
